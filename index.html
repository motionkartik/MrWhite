<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mr White">
<title>Mr White</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%23161616'/%3E%3Ccircle cx='256' cy='256' r='104' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#fff;
    --text:#161616;
    --line:#e7e7e7;
    --black:#161616;
    --danger:#ff0000;
    --purple:#7428ff;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body,button,.app,.screen,.card,.row,.stack,.pill,.player-line,.player-name,.player-role,.word-note,.pass-secret,.pass-count,.discussion-player,.vote-option,.modal,.modal-backdrop,.ghost,.btn,.mono,.eyebrow,h1,h2,h3,p,label,span,div{
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  input,textarea,select{
    -webkit-user-select:text;
    user-select:text;
    -webkit-touch-callout:default;
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;min-height:100dvh}
  button,input{font:inherit}
  button{cursor:pointer;touch-action:manipulation}
  [data-hold]{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  button:focus-visible,[data-hold]:focus-visible{outline:2px solid #161616;outline-offset:2px}
  .btn:disabled{opacity:.5;cursor:default}
  .app{width:100%;max-width:760px;margin:0 auto;padding:24px 20px calc(32px + env(safe-area-inset-bottom))}
  .wide{max-width:900px}
  .screen{min-height:calc(100vh - 56px);min-height:calc(100dvh - 56px);display:flex;flex-direction:column}
  .center-screen{align-items:center;text-align:center;justify-content:center}
  .eyebrow{font:13px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;color:#666;margin:0 0 14px}
  h1{font-size:clamp(32px,9vw,52px);line-height:1.03;letter-spacing:-.045em;margin:0 0 10px;font-weight:700}
  h2{font-size:31px;line-height:1.06;letter-spacing:-.04em;margin:0 0 8px;font-weight:700}
  h3{font-size:20px;margin:0 0 8px;letter-spacing:-.02em}
  p{margin:0;color:#555;font-size:16px;line-height:1.45}
  .section-title{font-size:17px;margin-bottom:3px}
  .card{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:22px;margin-top:14px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .accordion-toggle{width:100%;border:0;background:transparent;padding:0;text-align:left;font:inherit;color:inherit}
  .accordion-chevron{transition:transform .18s ease}
  .accordion-chevron.open{transform:rotate(180deg)}
  .stack{display:flex;flex-direction:column;gap:12px}
  .muted{color:#8a8a8a}
  .mono{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;color:#666}
  .small{font-size:14px}
  .btn{border:1px solid var(--line);background:#fff;color:#161616;border-radius:999px;min-height:52px;padding:0 22px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
  .btn.black{background:var(--black);border-color:var(--black);color:#fff}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn.full{width:100%}
  .btn.smallbtn{min-height:38px;padding:0 14px;font-size:14px}
  .ghost{border:0;background:transparent;padding:10px;color:#222;text-align:center}
  .ghost.full{width:100%;display:flex;align-items:center;justify-content:center}
  .bottom-actions{margin-top:auto;padding-top:24px}
  .bottom-actions .btn{margin-top:12px}
  .count-control{display:flex;align-items:center;gap:9px}
  .count-control button{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:#fff;color:#111;font-size:18px;line-height:1}
  .count-value{min-width:64px;text-align:center;border:1px solid var(--line);height:44px;border-radius:7px;display:flex;align-items:center;justify-content:center}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
  .role-item{min-width:0}
  .role-label{font-size:14px;color:#555;margin-bottom:8px}
  .role-box{display:flex;gap:8px;align-items:center}
  .role-box button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff}
  .role-num{flex:1;height:44px;border:1px solid var(--line);border-radius:7px;display:flex;align-items:center;justify-content:center}
  .summary{margin-top:18px}
  .pill-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:14px;line-height:1}
  .pill.on{background:#161616;border-color:#161616;color:#fff}
  .input{width:100%;height:44px;padding:0 13px;border:1px solid var(--line);border-radius:7px;outline:none;background:#fff;color:#111}
  .input:focus{border-color:#888;box-shadow:0 0 0 3px rgba(0,0,0,.05)}
  .players-table{margin-top:8px}
  .player-line{height:49px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px}
  .player-line:last-child{border-bottom:0}
  .player-name{font-size:16px}
  .player-role{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;color:#666;text-align:right}
  .player-role.infiltrator{color:var(--purple)}
  .player-role.white{color:#111}
  .word-note{margin-top:14px;font-size:14px;color:#555}
  .center-orb{width:224px;height:224px;border-radius:50%;background:#161616;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:19px;line-height:1.25;font-weight:600;margin:24px auto}
  .center-orb.revealed{width:min(520px,calc(100vw - 40px));height:auto;min-height:224px;border-radius:18px;padding:28px}
  .pass-secret{width:100%;text-align:center}
  .pass-secret h1{margin:8px 0 10px}
  .pass-secret p{margin:0;font-size:16px;line-height:1.5}
  .pass-back{margin-top:10px}
  .peek-secret{margin:12px 0 18px}
  .peek-secret h3{margin:6px 0 0}
  .peek-secret.hidden{display:none}
  .pass-count{margin-top:14px;width:100%;text-align:center}
  .reveal-wrap{max-width:560px;width:100%;margin:0 auto}
  .discussion-list{margin-top:30px}
  .discussion-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .discussion-player{border:1px solid var(--line);background:#fafafa;border-radius:10px;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
  .discussion-player.done{opacity:.65}
  .discussion-player.done .player-name{text-decoration:line-through}
  .eye{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:#fff;font-size:16px}
  .vote-list{margin-top:28px;display:grid;gap:9px}
  .vote-option{border:1px solid var(--line);box-shadow:0 2px 4px rgba(0,0,0,.04);border-radius:9px;background:#fff;min-height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:16px}
  .vote-option span:last-child{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;color:#666}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.31);display:none;align-items:center;justify-content:center;padding:22px;z-index:20}
  .modal-backdrop.show{display:flex}
  .modal{width:min(100%,384px);background:#fff;border-radius:13px;padding:24px 20px 20px;box-shadow:0 20px 60px rgba(0,0,0,.16);text-align:center}
  .modal h3{font-size:23px;margin-bottom:18px}
  .modal p{font-size:14px;line-height:1.45;margin-bottom:18px}
  .modal .input{margin:-4px 0 10px}
  .modal .btn{margin-top:7px}
  .modal .ghost{width:100%}
  .field-label{font-size:14px;color:#555;margin-bottom:7px;display:block}
  .inline-field{display:flex;gap:8px}
  .inline-field .input{flex:1}
  .notice{padding:11px 13px;border:1px solid var(--line);background:#fafafa;border-radius:9px;font-size:13px;color:#555;line-height:1.4}
  .hidden{display:none!important}
  .setup-header{margin-bottom:24px}
  @media(max-width:640px){
    .app{padding:20px 20px calc(28px + env(safe-area-inset-bottom))}
    .screen{min-height:calc(100vh - 48px);min-height:calc(100dvh - 48px)}
    .card{padding:20px;margin-top:12px}
    .role-grid{grid-template-columns:1fr;gap:14px}
    h1{font-size:44px}
    h2{font-size:30px}
  }
  @media(min-width:700px){.mobile-title{font-size:54px}}
</style>
</head>

  'use strict';

    Phobias:[['Heights','Flying'],['Darkness','Silence'],['Spiders','Snakes'],['Crowds','Closed Spaces'],['Water','Fire'],['Ghosts','Death'],['Needles','Blood'],['Clowns','Masks']],
    History:[['King','Emperor'],['Castle','Fort'],['Revolution','War'],['Ancient Rome','Ancient Greece'],['Knight','Samurai'],['Pharaoh','Mummy'],['Gladiator','Centurion'],['Pirate','Viking'],['Caveman','Hunter-Gatherer']],
    Office:[['Meeting','Conference'],['Printer','Scanner'],['Manager','Director'],['Desk','Cubicle'],['Stapler','Paperclip'],['Whiteboard','Projector'],['Keyboard','Monitor'],['Shredder','Fax Machine']],
    Programming:[['JavaScript','TypeScript'],['Python','Ruby'],['Compiler','Interpreter'],['Bug','Error'],['Function','Method'],['Array','Object'],['Loop','Condition'],['Variable','Constant'],['Frontend','Backend']],
    Fashion:[['Suit','Tuxedo'],['Saree','Lehenga'],['Sneakers','Trainers'],['Jacket','Coat'],['Jeans','Trousers'],['Tie','Bowtie'],['Dress','Skirt'],['Hat','Cap'],['Scarf','Gloves']],
    Space:[['Moon','Mars'],['Astronaut','Cosmonaut'],['Rocket','Shuttle'],['Galaxy','Nebula'],['Comet','Meteor'],['Satellite','Telescope'],['Black Hole','Wormhole'],['Planet','Star']],
    'Deep Sea':[['Whale','Shark'],['Coral','Seaweed'],['Submarine','Underwater Drone'],['Trench','Canyon'],['Octopus','Squid'],['Jellyfish','Starfish'],['Anglerfish','Lanternfish'],['Pearl','Oyster']],
    Landmarks:[['Eiffel Tower','Arc de Triomphe'],['Taj Mahal','Red Fort'],['Statue of Liberty','Golden Gate Bridge'],['Big Ben','London Eye'],['Colosseum','Roman Forum'],['Great Wall','Pyramids'],['Stonehenge','Easter Island']],
    'Furniture & Decor':[['Sofa','Couch'],['Curtain','Blind'],['Lamp','Lantern'],['Table','Desk'],['Bookshelf','Wardrobe'],['Rug','Carpet'],['Vase','Bowl'],['Painting','Poster']],
    'Tools & Hardware':[['Hammer','Mallet'],['Screwdriver','Drill'],['Saw','Blade'],['Nail','Screw'],['Pliers','Wrench'],['Tape Measure','Level'],['Torch','Flashlight'],['Bolt','Nut']],
    'Holidays & Celebrations':[['Birthday','Anniversary'],['Wedding','Engagement'],['Festival','Fair'],['Party','Gathering'],['Graduation','Ceremony'],['Halloween','Thanksgiving'],['Baby Shower','Bridal Shower'],['Parade','Carnival']],
    'Hobbies & Crafts':[['Painting','Drawing'],['Knitting','Crochet'],['Photography','Filmmaking'],['Gardening','Farming'],['Pottery','Sculpting'],['Origami','Papier-mâché'],['Calligraphy','Lettering'],['Jewelry Making','Beading']],
    Bollywood:[['Hero','Star'],['Item Song','Dance Number'],['Director','Producer'],['Climax','Interval'],['Masala','Action'],['Villain','Sidekick'],['Playback Singer','Lyricist'],['Romance','Drama']]
  };

  /* ---------- state & persistence ---------- */

  let state = loadState();
  const uiExpanded = { categories:false, playerNames:false };
  const app = document.getElementById('app');
  const modalRoot = document.getElementById('modalRoot');
  let saveTimer = null;
  let peekIndex = null;
  let pendingElimination = null;
  let lastPair = null;
  let modalCancelFn = null;

  function clone(v){ return JSON.parse(JSON.stringify(v)); }
  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  function saveDebounced(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 300); }

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return clone(DEFAULT_STATE);
      const parsed = JSON.parse(raw);
      const merged = Object.assign(clone(DEFAULT_STATE), parsed, {
        roles: Object.assign(clone(DEFAULT_STATE.roles), parsed.roles || {})
      });
      // migrate legacy keys from older versions
      delete merged.revealed; delete merged.discussionDone; delete merged.currentRevealIndex;
      if(parsed.mysteryModeConfigured !== true){ merged.mysteryMode = true; merged.mysteryModeConfigured = true; }
      if(!isValidGameState(merged)){
        merged.screen = 'setup';
        merged.players = []; merged.words = null; merged.currentPassIndex = 0; merged.eliminated = [];
      }
      return merged;
    }catch(e){ return clone(DEFAULT_STATE); }
  }

  function isValidGameState(s){
    if(s.screen === 'setup') return true;
    if(!['pass','discussion','vote','result'].includes(s.screen)) return false;
    if(!Array.isArray(s.players) || !s.players.length) return false;
    if(!Number.isInteger(s.currentPassIndex) || s.currentPassIndex < 0 || s.currentPassIndex >= s.players.length) return false;
    if(!s.words || typeof s.words.civilian !== 'string' || typeof s.words.undercover !== 'string') return false;
    return true;
  }

  /* ---------- utils ---------- */

  function esc(str){ return String(str ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c])); }
  function vibrate(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(_){} }

  /* ---------- pure game logic (unit-testable) ---------- */

  function normalizeRoleCounts(playerCount, undercover, white){
    let p = Math.max(3, Math.min(20, Math.floor(Number(playerCount) || 5)));
    let u = Math.max(0, Math.floor(Number(undercover) || 0));
    let w = Math.max(0, Math.floor(Number(white) || 0));
    if(u + w > p - 1){
      const overflow = u + w - (p - 1);
      if(w >= overflow){ w -= overflow; } else { u -= overflow - w; w = 0; }
    }
    let c = p - u - w;
    if(c < 1) c = 1;
    return { playerCount:p, civilian:c, undercover:u, white:w };
  }

  function winnerFor(counts){
    if(counts.undercover === 0 && counts.white === 0) return 'Civilians';
    if(counts.civilians === 0) return counts.undercover > 0 ? 'Undercover team' : 'Mr White';
    return null;
  }

  function samePair(a, b){
    return !!a && !!b && a[0] === b[0] && a[1] === b[1];
  }

  /* ---------- derived state ---------- */

  function normalizeCounts(){
    const n = normalizeRoleCounts(state.playerCount, state.roles.undercover, state.roles.white);
    state.playerCount = n.playerCount;
    state.roles = { civilian:n.civilian, undercover:n.undercover, white:n.white };
  }
  function syncNames(){
    const n = state.playerCount;
    state.playerNames = Array.from({length:n}, (_, i) => state.playerNames[i] || `Player ${i+1}`);
  }
  function resetRoundData(){
    state.players = []; state.currentPassIndex = 0; state.eliminated = [];
    state.words = null; state.lastWinner = null; state.turn = 1;
  }
  function getActivePlayers(){ return state.players.filter(p => !p.eliminated); }
  function currentPlayer(){ return state.players[state.currentPassIndex]; }
  function remainingCounts(){
    const active = getActivePlayers();
    return {
      civilians: active.filter(p => p.role === 'civilian').length,
      undercover: active.filter(p => p.role === 'undercover').length,
      white: active.filter(p => p.role === 'white').length
    };
  }
  function checkWinner(){ return winnerFor(remainingCounts()); }
  function roleText(role){
    if(role === 'civilian') return 'Civilian';
    if(role === 'undercover') return 'Undercover';
    return 'Mr White';
  }
  function rolePhrase(role){
    if(role === 'white') return 'Mr White';
    return role === 'undercover' ? 'an Undercover' : 'a Civilian';
  }
  function roleWord(player){
    if(player.role === 'white') return 'Mr White';
    return player.role === 'undercover' ? state.words.undercover : state.words.civilian;
  }

  /* ---------- round flow ---------- */

  function chooseWords(){
    if(state.customMode && state.customCivilian.trim() && state.customUndercover.trim()){
      return { civilian: state.customCivilian.trim(), undercover: state.customUndercover.trim() };
    }
    let pool = [];
    state.categories.filter(c => WORDS[c]).forEach(c => pool.push(...WORDS[c]));
    if(!pool.length) pool = [['Salsa','Guacamole']];
    let pair = pool[Math.floor(Math.random() * pool.length)];
    if(pool.length > 1 && samePair(pair, lastPair)){
      pair = pool[Math.floor(Math.random() * pool.length)]; // one re-roll to avoid repeats
    }
    lastPair = pair;
    return Math.random() < .5
      ? { civilian: pair[1], undercover: pair[0] }
      : { civilian: pair[0], undercover: pair[1] };
  }

  function shuffledRoles(){
    const roles = [];
    for(let i = 0; i < state.roles.civilian; i++) roles.push('civilian');
    for(let i = 0; i < state.roles.undercover; i++) roles.push('undercover');
    for(let i = 0; i < state.roles.white; i++) roles.push('white');
    for(let i = roles.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [roles[i], roles[j]] = [roles[j], roles[i]];
    }
    return roles;
  }

  function go(screen){
    state.screen = screen; save(); render();
    window.scrollTo({ top:0, behavior:'auto' });
  }

  function startRound(){
    normalizeCounts(); syncNames();
    const roles = shuffledRoles();
    state.players = state.playerNames.map((name, i) => ({
      name: name.trim() || `Player ${i+1}`, role: roles[i], eliminated: false
    }));
    state.words = chooseWords();
    state.currentPassIndex = 0; state.eliminated = [];
    state.lastWinner = null; state.turn = 1;
    go('pass');
  }

  function nextRound(){
    state.round += 1; state.turn = 1;
    const roles = shuffledRoles();
    state.players = state.players.map((p, i) => ({ name: p.name, role: roles[i], eliminated: false }));
    state.words = chooseWords();
    state.currentPassIndex = 0; state.eliminated = []; state.lastWinner = null;
    go('pass');
  }

  function nextPass(){
    if(state.currentPassIndex >= state.players.length - 1){
      state.currentPassIndex = 0; go('discussion'); return;
    }
    state.currentPassIndex++; go('pass');
  }

  function endGame(winner){
    state.lastWinner = winner;
    go('result');
  }

  function advanceTurn(votedOut){
    state.turn += 1;
    go('discussion');
    if(votedOut) showVotedOutModal(votedOut);
  }

  function eliminate(index){
    const p = state.players[index];
    if(!p || p.eliminated) return;
    p.eliminated = true;
    state.eliminated.push(index);
    save();
    if(p.role === 'white'){ showWhiteGuessModal(p); return; }
    const winner = checkWinner();
    if(winner){ endGame(winner); return; }
    advanceTurn(p);
  }

  function resolveWhiteGuess(correct){
    if(correct){ endGame('Mr White'); return; }
    const winner = checkWinner();
    if(winner){ endGame(winner); return; }
    advanceTurn(null);
  }

  /* ---------- modals ---------- */

  function openModal(html, opts = {}){
    modalCancelFn = opts.onCancel || null;
    modalRoot.innerHTML =
      `<div class="modal-backdrop show" id="backdrop"><div class="modal" tabindex="-1" role="dialog" aria-modal="true">${html}</div></div>`;
    const backdrop = document.getElementById('backdrop');
    backdrop.addEventListener('click', e => { if(e.target === backdrop) closeViaCancel(); });
    const input = modalRoot.querySelector('input');
    if(input){ input.focus(); } else { modalRoot.querySelector('.modal').focus(); }
  }
  function closeModal(){ modalCancelFn = null; modalRoot.innerHTML = ''; }
  function closeViaCancel(){ const fn = modalCancelFn; closeModal(); if(fn) fn(); }

  function showVotedOutModal(p){
    openModal(`<h3>Voted out ${esc(p.name)} was ${rolePhrase(p.role)}.</h3>
      <button class="btn black full" id="contBtn">Continue →</button>`);
  }

  function showWhiteGuessModal(p){
    openModal(`<h3>Voted out ${esc(p.name)} was Mr White.</h3>
      <p>Mr White gets one chance to guess the civilian word and steal the win.</p>
      <input class="input" id="whiteGuessInput" placeholder="Civilian word" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn black full" id="whiteGuessBtn" disabled>Lock in guess →</button>
      <button class="ghost full" id="cancelWhiteGuess">Skip guess</button>`,
      { onCancel: () => resolveWhiteGuess(false) });
  }

  function showRevealModal(index){
    peekIndex = index;
    const player = state.players[index];
    openModal(`<div class="eyebrow">Heads up</div>
      <h3>Make sure no one is looking.</h3>
      <p>${esc(player.name)}, hold to peek.</p>
      <div id="peekSecret" class="peek-secret hidden" aria-live="polite"></div>
      <button class="btn black full" data-hold="peek" id="holdPeek">Hold to reveal</button>
      <button class="ghost full" id="cancelModal">Back</button>`);
  }

  function peekSecretMarkup(){
    const player = state.players[peekIndex];
    if(!player) return '';
    if(player.role === 'white'){
      return `<div class="eyebrow">Your secret role</div><h3>Mr White</h3><p>You do not receive a word. Listen carefully and deduce the civilian word.</p>`;
    }
    return `<div class="eyebrow">Your secret word</div><h3>${esc(roleWord(player))}</h3>`;
  }

  function passSecretMarkup(){
    const p = currentPlayer();
    const isWhite = p.role === 'white';
    const mystery = state.mysteryMode && !isWhite;
    const eyebrow = isWhite ? 'You are' : 'Your word is';
    const title = isWhite ? 'Mr White' : (mystery ? esc(roleWord(p)) : `${roleText(p.role)} · ${esc(roleWord(p))}`);
    return `<div class="pass-secret"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>Release to hide and pass.</p></div>`;
  }

  /* ---------- hold-to-reveal (delegated, pointer + keyboard) ---------- */

  let holdTimer = null, holdEl = null, holdShown = false;

  function startHold(el){
    if(holdTimer) return;
    holdEl = el; holdShown = false;
    holdTimer = setTimeout(() => {
      holdTimer = null; holdShown = true;
      renderHold(el);
      vibrate(15);
    }, 10);
  }
  function endHold(){
    if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
    if(holdEl && holdShown) clearHold(holdEl);
    holdEl = null; holdShown = false;
  }
  function renderHold(el){
    if(el.dataset.hold === 'pass'){
      el.innerHTML = passSecretMarkup();
      el.classList.add('revealed');
    }else{
      const secret = document.getElementById('peekSecret');
      if(secret){ secret.innerHTML = peekSecretMarkup(); secret.classList.remove('hidden'); }
    }
  }
  function clearHold(el){
    if(el.dataset.hold === 'pass'){
      el.classList.remove('revealed');
      el.innerHTML = '<span class="hold-label">Hold to<br>reveal</span>';
    }else{
      const secret = document.getElementById('peekSecret');
      if(secret){ secret.innerHTML = ''; secret.classList.add('hidden'); }
    }
  }

  /* ---------- rendering ---------- */

  function categoryButton(c){
    const on = state.categories.includes(c);
    return `<button class="pill ${on ? 'on' : ''}" data-category="${esc(c)}" aria-pressed="${on}">${esc(c)}</button>`;
  }

  function renderSetup(){
    normalizeCounts(); syncNames();
    const selected = state.categories.length;
    const seen = new Set(); let dup = false;
    state.playerNames.slice(0, state.playerCount).forEach(n => {
      const k = n.trim().toLowerCase();
      if(!k) return;
      if(seen.has(k)) dup = true;
      seen.add(k);
    });
    return `<div class="screen">
      <div class="setup-header"><div class="eyebrow">Mr White by motionkartik</div><h1>New game.</h1><p>Configure the table, then start the round.</p></div>
      <div class="card"><div class="row"><div><div class="section-title">Players</div><div class="small muted">Recommended: 5–8 for the sharpest deduction.</div></div><div class="count-control"><button id="playerMinus" aria-label="Remove a player">−</button><div class="count-value" id="playerCount">${state.playerCount}</div><button id="playerPlus" aria-label="Add a player">+</button></div></div></div>
      <div class="card"><div class="section-title">Roles</div><div class="small">Set Undercovers and Mr Whites. Civilians fill the remaining seats.</div>
        <div class="role-grid">
          <div class="role-item"><div class="role-label">Undercovers</div><div class="role-box"><button data-role="undercover" data-delta="-1" aria-label="Fewer Undercovers">−</button><div class="role-num">${state.roles.undercover}</div><button data-role="undercover" data-delta="1" aria-label="More Undercovers">+</button></div></div>
          <div class="role-item"><div class="role-label">Mr Whites</div><div class="role-box"><button data-role="white" data-delta="-1" aria-label="Fewer Mr Whites">−</button><div class="role-num">${state.roles.white}</div><button data-role="white" data-delta="1" aria-label="More Mr Whites">+</button></div></div>
        </div>
        <div class="summary mono">${state.roles.undercover} Undercover · ${state.roles.white} Mr White · ${state.roles.civilian} Civilian</div>
      </div>
      <div class="card"><div class="section-title">Word source</div><div class="stack" style="margin-top:14px">
        <button class="btn ${!state.customMode ? 'black' : ''} full" id="databaseBtn">From Category</button>
        <button class="btn ${state.customMode ? 'black' : ''} full" id="customBtn">Custom</button>
        ${state.customMode ? `<div class="stack"><div><label class="field-label" for="customCivilian">Civilian word</label><input class="input" id="customCivilian" value="${esc(state.customCivilian)}" placeholder="Example: Ketchup" autocomplete="off" spellcheck="false"></div><div><label class="field-label" for="customUndercover">Undercover word</label><input class="input" id="customUndercover" value="${esc(state.customUndercover)}" placeholder="Example: Mustard" autocomplete="off" spellcheck="false"></div></div>` : ''}
      </div></div>
      ${!state.customMode ? `<div class="card"><button class="row accordion-toggle" data-accordion="categories" aria-expanded="${uiExpanded.categories}"><div class="section-title">Categories <span class="muted">(${selected} selected)</span></div><div class="mono accordion-chevron ${uiExpanded.categories ? 'open' : ''}">⌄</div></button>${selected === 0 ? '<div class="notice" style="margin-top:12px">Pick at least one category — otherwise the game falls back to a random pair.</div>' : ''}<div class="pill-wrap ${uiExpanded.categories ? '' : 'hidden'}">${CATEGORIES.map(categoryButton).join('')}</div></div>` : ''}
      <div class="card"><button class="row accordion-toggle" data-accordion="playerNames" aria-expanded="${uiExpanded.playerNames}"><div class="section-title">Player names <span class="muted">(optional)</span></div><div class="mono accordion-chevron ${uiExpanded.playerNames ? 'open' : ''}">⌄</div></button>${dup ? '<div class="notice" style="margin-top:12px">Two players share a name — votes and peeks may get confusing.</div>' : ''}<div class="stack ${uiExpanded.playerNames ? '' : 'hidden'}" style="margin-top:14px">${state.playerNames.map((n, i) => `<div class="inline-field"><label class="mono" style="width:44px;display:flex;align-items:center" for="nameInput${i}">P${i+1}</label><input class="input player-input" id="nameInput${i}" data-index="${i}" value="${esc(n)}" autocomplete="off" spellcheck="false"></div>`).join('')}<button class="ghost full" id="resetNamesBtn">Reset names</button></div></div>
      <div class="card"><div class="row"><div><div class="section-title">Mystery mode</div><div class="small muted">During the phone pass, civilians and Undercovers see only their word. Mr White still sees their role.</div></div><button class="btn smallbtn ${state.mysteryMode ? 'black' : ''}" id="mysteryBtn" aria-pressed="${state.mysteryMode}">${state.mysteryMode ? 'On' : 'Off'}</button></div></div>
      <div class="bottom-actions"><button class="btn black full" id="startBtn">Start round →</button></div>
    </div>`;
  }

  function renderPass(){
    const p = currentPlayer();
    const canBack = state.currentPassIndex > 0;
    const last = state.currentPassIndex >= state.players.length - 1;
    return `<div class="screen center-screen"><div class="reveal-wrap"><div class="eyebrow">Pass the phone</div><h1>Pass to ${esc(p.name)}.</h1><p>Tap and hold to reveal your secret.</p><div class="center-orb" data-hold="pass" id="holdReveal" tabindex="0" role="button" aria-label="Hold to reveal your secret"><span class="hold-label">Hold to<br>reveal</span></div>
    <button class="btn black full" id="passNextBtn">${last ? 'Start discussion →' : 'Pass to next player →'}</button>${canBack ? '<button class="ghost pass-back" id="backPass">← Back to previous player</button>' : ''}</div></div>`;
  }

  function renderDiscussion(){
    const active = getActivePlayers();
    const elim = state.players.filter(p => p.eliminated);
    return `<div class="screen"><div style="text-align:center"><div class="eyebrow">Round ${state.round} · Turn ${state.turn}</div><h1 class="mobile-title">Describe your word in one sentence.</h1><p>Go round the table. When you're ready, hit vote.</p></div><div class="discussion-list"><div class="section-title mono">Still in</div><div class="discussion-grid">${active.map(p => { const i = state.players.indexOf(p); return `<div class="discussion-player"><span class="player-name">${esc(p.name)}</span><button class="eye" data-peek="${i}" aria-label="Peek at your word">◉</button></div>`; }).join('')}</div>${elim.length ? `<div class="section-title mono" style="margin-top:18px">Eliminated</div><div class="discussion-grid">${elim.map(p => `<div class="discussion-player done"><span class="player-name">${esc(p.name)}</span><span class="player-role ${p.role === 'undercover' ? 'infiltrator' : ''}">${roleText(p.role)}</span></div>`).join('')}</div>` : ''}<div class="small muted" style="text-align:center;margin-top:10px">Tap ◉ next to your name to peek at your word.</div></div><div class="bottom-actions"><button class="btn black full" id="voteBtn">Move to vote →</button><button class="ghost full" id="endGameBtn">End game</button></div></div>`;
  }

  function renderVote(){
    const active = getActivePlayers();
    return `<div class="screen"><div><div class="eyebrow">Round ${state.round} · Turn ${state.turn} · Vote</div><h2>Who's the infiltrator?</h2><p>Pick the player the table agrees to eliminate.</p></div><div class="vote-list">${active.map(p => { const i = state.players.indexOf(p); return `<button class="vote-option" data-vote="${i}"><span>${esc(p.name)}</span><span>Eliminate →</span></button>`; }).join('')}</div><div class="bottom-actions"><button class="ghost full" id="backDiscussion">← Back to discussion</button></div></div>`;
  }

  function renderResult(){
    const elim = state.eliminated.map(i => state.players[i]).filter(Boolean);
    const latest = elim[elim.length - 1];
    const heading = state.lastWinner ? `${esc(state.lastWinner)} ${state.lastWinner === 'Mr White' ? 'wins' : 'win'}.` : 'Game ended.';
    return `<div class="screen center-screen"><div class="reveal-wrap"><div class="eyebrow">Round ${state.round} result</div><h1>${heading}</h1><p>${latest ? `${esc(latest.name)} was ${rolePhrase(latest.role)}.` : ''}</p><div class="card"><div class="mono" style="margin-bottom:8px">Round recap</div><div class="players-table">${state.players.map(p => `<div class="player-line"><span class="player-name">${esc(p.name)}</span><span class="player-role ${p.role === 'undercover' ? 'infiltrator' : p.role === 'white' ? 'white' : ''}">${roleText(p.role)}${p.eliminated ? ' · eliminated' : ''}</span></div>`).join('')}</div><div class="word-note">The word was <strong>${esc(state.words.civilian)}</strong>. Undercover word was <strong>${esc(state.words.undercover)}</strong>.</div></div><div class="bottom-actions">${state.lastWinner ? '<button class="btn black full" id="nextRoundBtn">Next round, same group →</button>' : ''}<button class="btn full" id="newGameBtn">New game</button></div></div></div>`;
  }

  function render(){
    // defense in depth: never render a game screen without players
    if(state.screen !== 'setup' && !(Array.isArray(state.players) && state.players.length)){
      state.screen = 'setup';
    }
    app.className = 'app ' + (state.screen === 'setup' ? 'wide' : '');
    if(state.screen === 'setup') app.innerHTML = renderSetup();
    else if(state.screen === 'pass') app.innerHTML = renderPass();
    else if(state.screen === 'discussion') app.innerHTML = renderDiscussion();
    else if(state.screen === 'vote') app.innerHTML = renderVote();
    else if(state.screen === 'result') app.innerHTML = renderResult();
  }

  /* ---------- events (fully delegated) ---------- */

  document.addEventListener('click', e => {
    const q = s => e.target.closest(s);
    let el;

    if((el = q('[data-accordion]'))){
      uiExpanded[el.dataset.accordion] = !uiExpanded[el.dataset.accordion];
      render(); return;
    }
    if((el = q('[data-category]'))){
      const c = el.dataset.category;
      state.categories = state.categories.includes(c)
        ? state.categories.filter(x => x !== c)
        : [...state.categories, c];
      save(); render(); return;
    }
    if((el = q('[data-role]'))){
      const r = el.dataset.role, d = Number(el.dataset.delta);
      if(d > 0){
        if(state.roles.civilian > 1 && state.roles[r] < state.playerCount - 1){
          state.roles[r]++; state.roles.civilian--;
        }
      }else{
        if(state.roles[r] > 0){ state.roles[r]--; state.roles.civilian++; }
      }
      normalizeCounts(); save(); render(); return;
    }
    if((el = q('[data-peek]'))){ showRevealModal(Number(el.dataset.peek)); return; }
    if((el = q('[data-vote]'))){
      const i = Number(el.dataset.vote);
      const p = state.players[i];
      if(!p || p.eliminated) return;
      pendingElimination = i;
      openModal(`<h3>Eliminate ${esc(p.name)}?</h3><p>Their role will be revealed to the whole table.</p><button class="btn danger full" id="doEliminate">Eliminate</button><button class="ghost full" id="cancelModal">Cancel</button>`);
      return;
    }

    const button = q('button');
    const id = button ? button.id : '';
    switch(id){
      case 'playerMinus':
        if(state.playerCount > 3){
          state.playerCount--;
          if(state.roles.civilian > 1) state.roles.civilian--;
          else if(state.roles.white > 0) state.roles.white--;
          else state.roles.undercover--;
          normalizeCounts(); syncNames(); save(); render();
        }
        break;
      case 'playerPlus':
        if(state.playerCount < 20){
          state.playerCount++; state.roles.civilian++;
          syncNames(); save(); render();
        }
        break;
      case 'databaseBtn': state.customMode = false; save(); render(); break;
      case 'customBtn': state.customMode = true; save(); render(); break;
      case 'mysteryBtn':
        state.mysteryMode = !state.mysteryMode; state.mysteryModeConfigured = true;
        save(); render(); break;
      case 'resetNamesBtn':
        state.playerNames = Array.from({length: state.playerCount}, (_, i) => `Player ${i+1}`);
        save(); render(); break;
      case 'startBtn':
        if(state.customMode && (!state.customCivilian.trim() || !state.customUndercover.trim())){
          openModal(`<h3>Missing words.</h3><p>Enter both a civilian word and an undercover word, or switch back to the word database.</p><button class="btn black full" id="contBtn">Continue →</button>`);
          break;
        }
        startRound(); break;
      case 'passNextBtn': nextPass(); break;
      case 'backPass':
        state.currentPassIndex = Math.max(0, state.currentPassIndex - 1);
        go('pass'); break;
      case 'voteBtn': go('vote'); break;
      case 'endGameBtn':
        openModal(`<h3>End game?</h3><p>The round will stop and you'll see who everyone was.</p><button class="btn danger full" id="confirmEnd">End game</button><button class="ghost full" id="cancelEnd">Cancel</button>`);
        break;
      case 'backDiscussion': go('discussion'); break;
      case 'nextRoundBtn': nextRound(); break;
      case 'newGameBtn':
        openModal(`<h3>Start a new game?</h3><p>Current round progress will be cleared. Your players, roles and categories stay as they are.</p><button class="btn danger full" id="confirmNewGame">New game</button><button class="ghost full" id="cancelNewGame">Cancel</button>`);
        break;
      /* modal buttons */
      case 'contBtn': case 'guessContBtn': closeModal(); break;
      case 'cancelModal': case 'cancelEnd': case 'cancelNewGame': closeViaCancel(); break;
      case 'doEliminate': {
        const i = pendingElimination; pendingElimination = null;
        closeModal(); if(i != null) eliminate(i);
        break;
      }
      case 'confirmEnd': state.lastWinner = null; closeModal(); go('result'); break;
      case 'confirmNewGame': resetRoundData(); state.round = 1; closeModal(); go('setup'); break;
      case 'whiteGuessBtn': {
        const input = document.getElementById('whiteGuessInput');
        const guess = ((input && input.value) || '').trim().toLowerCase();
        closeModal();
        if(guess && guess === String(state.words.civilian).trim().toLowerCase()){
          resolveWhiteGuess(true);
        }else{
          openModal(`<h3>Not the word.</h3><p>The civilians keep their secret. The game continues.</p><button class="btn black full" id="guessContBtn">Continue →</button>`);
        }
        break;
      }
      case 'cancelWhiteGuess': closeViaCancel(); break;
    }
  });

  document.addEventListener('input', e => {
    const t = e.target;
    if(t.classList && t.classList.contains('player-input')){
      state.playerNames[Number(t.dataset.index)] = t.value;
      saveDebounced(); return;
    }
    if(t.id === 'customCivilian'){ state.customCivilian = t.value; saveDebounced(); return; }
    if(t.id === 'customUndercover'){ state.customUndercover = t.value; saveDebounced(); return; }
    if(t.id === 'whiteGuessInput'){
      const b = document.getElementById('whiteGuessBtn');
      if(b) b.disabled = !t.value.trim();
    }
  });

  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){
      if(modalRoot.childElementCount) closeViaCancel();
      return;
    }
    if(e.key === 'Enter' && e.target && e.target.id === 'whiteGuessInput'){
      const b = document.getElementById('whiteGuessBtn');
      if(b && !b.disabled){ e.preventDefault(); b.click(); }
      return;
    }
    const el = e.target && e.target.closest ? e.target.closest('[data-hold]') : null;
    if(el && (e.key === ' ' || e.key === 'Enter') && !e.repeat){
      e.preventDefault();

    }
  });
  document.addEventListener('keyup', e => {
    if(e.key === ' ' || e.key === 'Enter') endHold();
  });

  document.addEventListener('pointerdown', e => {
    const el = e.target.closest('[data-hold]');
    if(!el) return;
    e.preventDefault();
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    startHold(el);
  });
  document.addEventListener('pointerup', endHold);
  document.addEventListener('pointercancel', endHold);
  document.addEventListener('lostpointercapture', endHold);
  window.addEventListener('blur', endHold);

  document.addEventListener('contextmenu', e => {
    if(e.target.closest('[data-hold]')) e.preventDefault();
  });

  /* ---------- wake lock ---------- */

  let wakeLock = null;
  async function requestWakeLock(){
    try{
      if('wakeLock' in navigator && !wakeLock){
        wakeLock = await navigator.wakeLock.request('screen');
        if(wakeLock.addEventListener) wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    }catch(_){}
  }
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') requestWakeLock();
  });

  /* ---------- PWA manifest (inline data URI, stays single-file) ---------- */

  function installManifest(){
    try{
      const icon = 'data:image/svg+xml,' + encodeURIComponent(
        "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='110' fill='#161616'/><circle cx='256' cy='256' r='104' fill='#ffffff'/></svg>"
      );
      const manifest = {
        name:'Mr White', short_name:'Mr White', display:'standalone',
        background_color:'#ffffff', theme_color:'#ffffff',
        icons:[{ src:icon, sizes:'any', type:'image/svg+xml', purpose:'any' }]
      };
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
      document.head.appendChild(link);
    }catch(_){}
  }

  /* ---------- self tests: open with ?test and read the console ---------- */

  function runSelfTests(){
    const rows = [];
    const t = (name, cond) => rows.push((cond ? '✓ PASS' : '✗ FAIL') + ': ' + name);
    t('Civilians win when both infiltrators are gone', winnerFor({civilians:2, undercover:0, white:0}) === 'Civilians');
    t('Undercover team wins at zero civilians', winnerFor({civilians:0, undercover:1, white:1}) === 'Undercover team');
    t('Mr White wins alone at zero civilians', winnerFor({civilians:0, undercover:0, white:1}) === 'Mr White');
    t('No winner mid-game', winnerFor({civilians:3, undercover:1, white:1}) === null);
    let n = normalizeRoleCounts(5, 4, 1);
    t('Role overflow clamps Mr White first', n.undercover === 4 && n.white === 0 && n.civilian === 1);
    n = normalizeRoleCounts(5, 3, 3);
    t('Role overflow clamps undercover too', n.undercover === 3 && n.white === 1 && n.civilian === 1);
    t('Player count clamps to 3 minimum', normalizeRoleCounts(2, 0, 0).playerCount === 3);
    t('Player count clamps to 20 maximum', normalizeRoleCounts(99, 0, 0).playerCount === 20);
    t('esc escapes HTML', esc('<b>&"\'') === '&lt;b&gt;&amp;&quot;&#039;');
    t('samePair matches identical pairs', samePair(['A','B'], ['A','B']) === true);
    t('samePair rejects flipped pairs', samePair(['A','B'], ['B','A']) === false);
    console.log(rows.join('\n'));
  }

  /* ---------- init ---------- */

  render();
  requestWakeLock();
  installManifest();
  if(new URLSearchParams(location.search).has('test')) runSelfTests();
})();
</script>
